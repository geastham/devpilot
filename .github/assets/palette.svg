    <text x="40" y="130" fill="#94A3B8">#0F1F3D</text>
    <text x="40" y="146" fill="#475569">bg-base</text>

    <rect x="140" y="48" width="88" height="64" rx="8" fill="#060F1E" stroke="#FFFFFF" stroke-opacity="0.14"/>

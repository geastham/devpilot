  <text x="40" y="176" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif" font-size="10.5" fill="#475569">Tokens live in tailwind.config.ts and design/07-DESIGN-SYSTEM-TOKENS.md — one source of truth for every surface.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="188" viewBox="0 0 1280 188" role="img" aria-label="DevPilot design tokens: surfaces, zone tints, signals and model routing colors">
  <defs>
    <linearGradient id="pBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1F3D"/>
      <stop offset="100%" stop-color="#060F1E"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="188" rx="0" fill="url(#pBg)"/>

  <g font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif">

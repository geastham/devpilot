<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The DevPilot mark as an icon: the terminal prompt from the dashboard header
    (src/components/brand/DevPilotMark.tsx), on its chip.

    Drawn BOLDER than the component. In the header the glyph is half the chip
    wide with a hairline stroke; at 16 CSS pixels that anti-aliases into a grey
    smudge. Here it spans most of the chip at nearly twice the weight, which is
    what survives a browser tab. The hosted app (devpilot-website, app/icon.svg)
    carries an identical copy.
  -->
  <!-- Border and fill as two solid shapes: a translucent stroke straddles the
       chip's edge and renders as two bands, light outside and dark inside. -->
  <rect width="64" height="64" rx="15" fill="#157181"/>
  <rect x="3" y="3" width="58" height="58" rx="12" fill="#0B2128"/>
  <path d="M18.5 20.5 L28.5 30.5 L18.5 40.5 M32 43.5 H45.5" fill="none" stroke="#67E8F9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
